name: Build Esenin site

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: esenin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Build
        run: npm run build

      - name: Save production build
        uses: actions/upload-artifact@v7
        with:
          name: esenin-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
